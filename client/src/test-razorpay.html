<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Razorpay Script Loading</title>
  </head>
  <body>
    <h1>Razorpay Script Loading Test</h1>
    <button id="loadScript">Load Razorpay Script</button>
    <button id="testPayment">Test Payment</button>
    <div id="status"></div>

    <script>
      // Simple script loader test
      function loadRazorpayScript() {
        return new Promise((resolve, reject) => {
          if (window.Razorpay) {
            console.log("Razorpay already loaded");
            resolve(true);
            return;
          }

          const script = document.createElement("script");
          script.src = "https://checkout.razorpay.com/v1/checkout.js";
          script.async = true;

          script.onload = () => {
            if (window.Razorpay) {
              console.log("Razorpay loaded successfully");
              resolve(true);
            } else {
              console.error("Razorpay object not available");
              reject(new Error("Razorpay object not available"));
            }
          };

          script.onerror = (error) => {
            console.error("Script load error:", error);
            reject(error);
          };

          document.head.appendChild(script);
        });
      }

      function updateStatus(message) {
        document.getElementById("status").innerHTML += "<p>" + message + "</p>";
      }

      document
        .getElementById("loadScript")
        .addEventListener("click", async () => {
          updateStatus("Loading Razorpay script...");
          try {
            await loadRazorpayScript();
            updateStatus("✅ Razorpay script loaded successfully!");
          } catch (error) {
            updateStatus("❌ Failed to load Razorpay script: " + error.message);
          }
        });

      document.getElementById("testPayment").addEventListener("click", () => {
        if (!window.Razorpay) {
          updateStatus("❌ Razorpay not loaded. Load script first.");
          return;
        }

        try {
          const options = {
            key: "rzp_test_tbHCcBCOBwdMeC",
            amount: 50000, // 500 INR in paise
            currency: "INR",
            name: "Test Payment",
            description: "Test transaction",
            order_id: "test_order_" + Date.now(),
            handler: function (response) {
              updateStatus(
                "✅ Payment successful: " + response.razorpay_payment_id
              );
            },
            prefill: {
              name: "Test User",
              email: "test@example.com",
              contact: "9999999999",
            },
            theme: {
              color: "#346870",
            },
          };

          const rzp = new window.Razorpay(options);
          rzp.open();
          updateStatus("🔄 Payment gateway opened");
        } catch (error) {
          updateStatus("❌ Payment initialization failed: " + error.message);
        }
      });
    </script>
  </body>
</html>
