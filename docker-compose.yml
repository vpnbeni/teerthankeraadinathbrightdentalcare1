version: "3.8"

services:
  # API Server
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: teerthanker-dental-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./server/.env.production
    volumes:
      - ./server/logs:/app/logs
      - ./server/uploads:/app/uploads
    networks:
      - dental-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB (for development/testing)
  mongodb:
    image: mongo:6.0
    container_name: teerthanker-dental-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: teerthanker-dental-care
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - dental-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: teerthanker-dental-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./client/dist:/var/www/client:ro
      - ./admin/dist:/var/www/admin:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - dental-network
    depends_on:
      - api

  # Redis (for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: teerthanker-dental-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dental-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-defaultpassword}

volumes:
  mongodb_data:
  redis_data:

networks:
  dental-network:
    driver: bridge
