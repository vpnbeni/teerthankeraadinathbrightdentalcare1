name: Deploy All to Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'admin/**'
      - 'shared/**'

jobs:
  build-and-deploy-client:
    name: Build & Deploy Client
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📚 Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-client-${{ hashFiles('**/package-lock.json') }}
        
    - name: 🔧 Install all dependencies (workspaces)
      run: |
        npm config set fetch-timeout 60000
        npm config set fetch-retry-mintimeout 20000
        npm config set fetch-retry-maxtimeout 120000
        npm install --workspace=shared --workspace=client --prefer-offline --no-audit
      timeout-minutes: 10
      
    - name: 🏗️ Build client
      working-directory: ./client
      run: npm run build
      env:
        VITE_API_URL: ${{ secrets.CLIENT_VITE_API_URL }}
        
    - name: 🧹 Clean up temporary FTP files
      continue-on-error: true
      run: |
        npm install -g basic-ftp
        node -e "
        const ftp = require('basic-ftp');
        const client = new ftp.Client();
        client.ftp.verbose = true;
        (async () => {
          try {
            await client.access({
              host: '${{ secrets.FTP_SERVER }}',
              user: '${{ secrets.FTP_USERNAME }}',
              password: '${{ secrets.FTP_PASSWORD }}',
              port: ${{ secrets.FTP_PORT || 21 }},
              secure: false
            });
            await client.cd('${{ secrets.FTP_CLIENT_PATH }}');
            const list = await client.list();
            for (const file of list) {
              if (file.name.startsWith('.in.')) {
                console.log('Removing temp file:', file.name);
                await client.remove(file.name);
              }
            }
            const assetsList = await client.list('assets');
            for (const file of assetsList) {
              if (file.name.startsWith('.in.')) {
                console.log('Removing temp file:', 'assets/' + file.name);
                await client.remove('assets/' + file.name);
              }
            }
          } catch (err) {
            console.log('Cleanup error (non-critical):', err.message);
          } finally {
            client.close();
          }
        })();
        "
        
    - name: 📤 Deploy client to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT || 21 }}
        protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
        local-dir: ./client/dist/
        server-dir: ${{ secrets.FTP_CLIENT_PATH }}
        dangerous-clean-slate: false
        
    - name: ✅ Client deployment complete
      run: echo "✅ Client deployed successfully!"

  build-and-deploy-admin:
    name: Build & Deploy Admin
    runs-on: ubuntu-latest
    needs: build-and-deploy-client
    timeout-minutes: 30

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📚 Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-admin-${{ hashFiles('**/package-lock.json') }}
        
    - name: 🔧 Install all dependencies (workspaces)
      run: |
        npm config set fetch-timeout 60000
        npm config set fetch-retry-mintimeout 20000
        npm config set fetch-retry-maxtimeout 120000
        npm install --workspace=shared --workspace=admin --prefer-offline --no-audit
      timeout-minutes: 10
      
    - name: 🏗️ Build admin
      working-directory: ./admin
      run: npm run build
      env:
        VITE_API_URL: ${{ secrets.ADMIN_VITE_API_URL }}
        
    - name: 🧹 Clean up temporary FTP files
      continue-on-error: true
      run: |
        npm install -g basic-ftp
        node -e "
        const ftp = require('basic-ftp');
        const client = new ftp.Client();
        client.ftp.verbose = true;
        (async () => {
          try {
            await client.access({
              host: '${{ secrets.FTP_SERVER }}',
              user: '${{ secrets.FTP_USERNAME }}',
              password: '${{ secrets.FTP_PASSWORD }}',
              port: ${{ secrets.FTP_PORT || 21 }},
              secure: false
            });
            await client.cd('${{ secrets.FTP_ADMIN_PATH }}');
            const list = await client.list();
            for (const file of list) {
              if (file.name.startsWith('.in.')) {
                console.log('Removing temp file:', file.name);
                await client.remove(file.name);
              }
            }
            const assetsList = await client.list('assets');
            for (const file of assetsList) {
              if (file.name.startsWith('.in.')) {
                console.log('Removing temp file:', 'assets/' + file.name);
                await client.remove('assets/' + file.name);
              }
            }
          } catch (err) {
            console.log('Cleanup error (non-critical):', err.message);
          } finally {
            client.close();
          }
        })();
        "
        
    - name: 📤 Deploy admin to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT || 21 }}
        protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
        local-dir: ./admin/dist/
        server-dir: ${{ secrets.FTP_ADMIN_PATH }}
        dangerous-clean-slate: false
        
    - name: ✅ Admin deployment complete
      run: echo "✅ Admin deployed successfully!"
      
    - name: 🎉 All deployments complete
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎉 All applications deployed successfully!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🌐 Client: https://yourdomain.com"
        echo "🔧 Admin: https://yourdomain.com/admin"
        echo "⏰ Time: $(date)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

